# Build the static site from the latest silybench-data and publish it to GitHub Pages.
# Runs on push, when silybench-data's CI reports new data (repository_dispatch), and daily.
name: deploy
on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [data-updated]
  schedule:
    - cron: "40 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build (fetches data from silybench-data)
        run: npm run build
        env:
          # "/silybench-site" on <user>.github.io; empty once a custom domain is set.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
